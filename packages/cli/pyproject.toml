[project]
name = "w3stringsx-cli"
version = "2.0.0"
description = "w3stringsx CLI application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "w3stringsx-lib",
    "w3stringsx-ioc",
    "w3stringsx-svc"
]

[tool.uv.sources]
w3stringsx-lib = { path = "../lib", editable = true }
w3stringsx-ioc = { path = "../ioc", editable = true }
w3stringsx-svc = { path = "../svc", editable = true }

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "python -m w3stringsx_cli.__main__"
build = "pyinstaller w3stringsx.spec"