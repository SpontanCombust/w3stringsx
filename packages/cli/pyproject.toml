[project]
name = "w3stringsx-cli"
version = "2.0.0"
description = "w3stringsx CLI application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "w3stringsx-lib",
    "w3stringsx-svc"
]

[tool.uv.sources]
w3stringsx-lib = { path = "../lib" }
w3stringsx-svc = { path = "../svc" }

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
dev = "w3stringsx_cli.__main__:main"
