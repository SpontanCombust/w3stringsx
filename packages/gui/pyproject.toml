[project]
name = "w3stringsx-gui"
version = "1.0.0"
description = "w3stringsx GUI application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet==0.28.3",
  "flet-dropzone>=0.2.0",
  "flet-reactive>=1.0.0",
  "w3stringsx-lib",
  "w3stringsx-ioc",
  "w3stringsx-svc",
]

[tool.uv.sources]
flet-reactive = { path = "../flet_reactive", editable = true }
w3stringsx-lib = { path = "../lib", editable = true }
w3stringsx-ioc = { path = "../ioc", editable = true }
w3stringsx-svc = { path = "../svc", editable = true }

[tool.flet]
# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
org = "w3stringsx"
product = "w3stringsx GUI"
company = "w3stringsx"
copyright = "Copyright (C) 2025 by Przemysław Cedro"

[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
flet-reactive = "../flet_reactive"
w3stringsx-lib = "../lib"
w3stringsx-ioc = "../ioc"
w3stringsx-svc = "../svc"

# fix random build erros
[tool.flet.flutter.pubspec.dependency_overrides]
webview_flutter_android = "4.10.1"

[dependency-groups]
dev = [
    "flet[cli,desktop]==0.28.3",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "flet run -d -r"
build = "flet build"
